[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taxi-tip-lab"
version = "0.1.0"
description = "Leakage-aware prediction of generous card tips on NYC yellow taxis"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3", "pandas>=2.2,<3", "pyarrow>=18,<24",
  "scikit-learn>=1.6,<1.9", "scipy>=1.14,<2", "matplotlib>=3.9,<4",
  "joblib>=1.4,<2", "tabulate>=0.9,<1", "pyshp>=2.3,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "jupyterlab>=4,<5"]
docs = ["mkdocs==1.6.1", "mkdocs-material>=9.6,<10"]

[project.scripts]
taxi-lab = "taxi_tip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
